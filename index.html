<!DOCTYPE html><html lang="zh-CN"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>我的专属聊天室</title>    <style>        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 0; }                /* 1. 登录遮罩层样式 */        #login-overlay {            position: fixed; top: 0; left: 0; width: 100%; height: 100%;            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10;        }        .login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; }        .login-box input { padding: 10px; font-size: 16px; margin-bottom: 10px; width: 200px; }        .login-box button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }        /* 2. 聊天室主界面样式 */        #chat-container { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }        .header { background: #4CAF50; color: white; padding: 15px; font-size: 18px; font-weight: bold; }        #messages { flex: 1; padding: 15px; overflow-y: auto; }        .message { margin-bottom: 10px; padding: 8px 12px; background: #e1f5fe; border-radius: 15px; max-width: 80%; word-wrap: break-word; }        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; }        .input-area input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; outline: none; }        .input-area button { padding: 10px 20px; margin-left: 10px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }    </style></head><body>    <!-- 1. 密码验证遮罩层 -->    <div id="login-overlay">        <div class="login-box">            <h2> 请输入访问密码</h2>            <input type="password" id="pwd-input" placeholder="输入密码">            <br>            <button onclick="checkPwd()">进入聊天室</button>        </div>    </div>    <!-- 2. 聊天室主界面 -->    <div id="chat-container">        <div class="header"> 专属聊天室</div>        <div id="messages"></div>        <div class="input-area">            <input type="text" id="msg-input" placeholder="输入消息..." autocomplete="off">            <button onclick="sendMessage()">发送</button>        </div>    </div>    <!-- 引入 Socket.io 客户端库 -->    <script src="/socket.io/socket.io.js"></script>    <script>        const socket = io();        const messagesDiv = document.getElementById('messages');        const msgInput = document.getElementById('msg-input');        // 1. 密码验证逻辑        function checkPwd() {            const pwd = document.getElementById('pwd-input').value;            socket.emit('join room', pwd); // 将密码发给后端        }        // 监听后端返回的验证结果        socket.on('auth success', function() {            document.getElementById('login-overlay').style.display = 'none'; // 隐藏遮罩            document.getElementById('chat-container').style.display = 'flex'; // 显示聊天室        });        socket.on('auth fail', function() {            alert(" 密码错误！请重新输入。");        });        // 2. 接收消息逻辑        socket.on('chat message', function(msg) {            const msgDiv = document.createElement('div');            msgDiv.className = 'message';            msgDiv.textContent = msg;            messagesDiv.appendChild(msgDiv);            messagesDiv.scrollTop = messagesDiv.scrollHeight; // 自动滚动到底部        });        // 3. 发送消息逻辑        function sendMessage() {            const msg = msgInput.value.trim();            if (msg) {                socket.emit('chat message', msg);                msgInput.value = '';            }        }        // 支持按回车键发送        msgInput.addEventListener('keypress', function(e) {            if (e.key === 'Enter') sendMessage();        });    </script></body></html>
